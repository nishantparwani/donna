<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Donna</title>
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="Your autonomous calendar agent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Donna">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M8.5 14l2.2 2.2 4.8-4.7"/></svg></span><span id="agentName">Donna</span></div>
    <nav class="nav" id="nav">
      <button data-view="today"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
      <button data-view="calendar"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Calendar</button>
      <button data-view="tasks"><svg class="i" viewBox="0 0 24 24"><path d="M9 11l2.5 2.5L16 9"/><rect x="3.5" y="3.5" width="17" height="17" rx="4"/></svg>Tasks<span class="count" id="taskCount"></span></button>
      <button data-view="habits"><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>Habits</button>
      <button data-view="insights"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Insights</button>
      <button data-view="activity"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</button>
      <button data-view="memory"><svg class="i" viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 0-4 12.7V19h8v-3.3A7 7 0 0 0 12 3zM9.5 22h5"/></svg>Memory</button>
      <button data-view="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
    </nav>
    <div class="side-section">Jump to</div>
    <div class="mini" id="mini"></div>
    <div class="side-foot">
      <div class="status-row"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
      <div class="status-row hint" id="aiText"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="view" id="view"></div>
  </main>

  <aside class="chat" id="chat">
    <div class="chat-head">
      <div class="who"><span class="avatar" id="chatAvatar">D</span><div><div id="chatName">Donna</div><div class="sub" id="chatSub">Your calendar agent</div></div></div>
      <span class="spacer"></span>
      <button class="btn ghost icon" id="clearChat" title="Clear conversation"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg></button>
      <button class="btn ghost icon hide-m" id="closeChat" title="Hide chat (Ctrl+J)"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l6 6-6 6M3 12h17"/></svg></button>
    </div>
    <div class="messages" id="messages" aria-live="polite"></div>
    <div class="suggest" id="suggest"></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Tell Donna what to do…" aria-label="Message"></textarea>
      <button class="btn icon mic" type="button" id="mic" title="Speak"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="btn primary icon" id="sendBtn" type="submit" title="Send (Enter)"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
  </aside>

  <nav class="tabbar" id="tabbar">
    <button data-view="today"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>Today</button>
    <button data-view="calendar"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18"/></svg>Calendar</button>
    <button data-view="chat"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>Donna</button>
    <button data-view="tasks"><svg class="i" viewBox="0 0 24 24"><path d="M9 11l2.5 2.5L16 9"/><rect x="3.5" y="3.5" width="17" height="17" rx="4"/></svg>Tasks</button>
    <button data-view="more"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>More</button>
  </nav>
</div>

<dialog id="editor">
  <form method="dialog" id="editorForm">
    <div class="dh"><h3 id="editorTitle">Event</h3><span class="spacer"></span><button class="btn ghost icon" type="button" data-close>✕</button></div>
    <div class="db">
      <label class="f">Title<input name="title" required autocomplete="off"></label>
      <div class="grid2">
        <label class="f">Starts<input name="start" type="datetime-local" step="300" required></label>
        <label class="f">Ends<input name="end" type="datetime-local" step="300" required></label>
      </div>
      <div class="grid2">
        <label class="f">Type
          <select name="kind"><option value="meeting">Meeting</option><option value="task">Task / study</option><option value="focus">Focus</option><option value="personal">Personal</option></select>
        </label>
        <label class="f">Guests (emails, comma-separated)<input name="guests" autocomplete="off"></label>
      </div>
      <label class="f">Location<input name="location" autocomplete="off"></label>
      <label class="f">Notes<textarea name="description" rows="2"></textarea></label>
      <div class="row">
        <label class="check"><input type="checkbox" name="meet"> Google Meet link</label>
        <label class="check"><input type="checkbox" name="flexible"> Flexible</label>
        <label class="check"><input type="checkbox" name="highStakes"> High-stakes</label>
        <label class="check"><input type="checkbox" name="protected"> Protected</label>
      </div>
      <div class="row hidden" id="scopeRow"><span class="hint">This is a repeating event.</span>
        <label class="check"><input type="radio" name="scope" value="this" checked> Only this one</label>
        <label class="check"><input type="radio" name="scope" value="series"> Whole series</label>
      </div>
    </div>
    <div class="df">
      <button class="btn danger" type="button" id="deleteBtn">Delete</button>
      <span class="spacer"></span>
      <button class="btn" type="button" data-close>Cancel</button>
      <button class="btn primary" type="submit">Save</button>
    </div>
  </form>
</dialog>

<dialog id="planner">
  <form method="dialog" id="plannerForm">
    <div class="dh"><h3>Plan my day</h3><span class="spacer"></span><button class="btn ghost icon" type="button" data-close>✕</button></div>
    <div class="db">
      <div class="grid2">
        <label class="f">Day<input name="day" type="date" required></label>
        <label class="f">Start at (empty = now / wake-up)<input name="from" type="time"></label>
      </div>
      <label class="f">What do you want to get done? One per line, with rough lengths
        <textarea name="items" rows="6" placeholder="CFA study 2h&#10;Personal project 3h&#10;5k run around 7pm&#10;College assignments 2h&#10;Weekly review in the evening"></textarea></label>
      <div class="row">
        <label class="check"><input type="checkbox" name="fill" checked> Fill every gap (max productivity)</label>
        <label class="check"><input type="checkbox" name="meals" checked> Keep lunch &amp; dinner</label>
        <label class="check"><input type="checkbox" name="reflow"> Re-arrange my existing study blocks too</label>
      </div>
      <p class="hint">Classes, labs, meetings and travel stay put. Nothing is cancelled. Blocks follow your focus span and breaks (Settings → You).</p>
    </div>
    <div class="df"><span class="spacer"></span><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Build my plan</button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
