<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a time</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f3f0e8">
<link rel="stylesheet" href="/app.css">
<style>
  body { min-height: 100vh; padding: 40px 20px 60px; }
  .page { max-width: 780px; margin: 0 auto; }
  .head { display: flex; gap: 16px; align-items: flex-end; margin-bottom: 26px; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
  .head img { width: 36px; height: 36px; }
  .head h1 { font-family: var(--serif); font-weight: 400; font-size: 46px; line-height: .95; margin: 0; letter-spacing: -.02em; }
  .grid { display: grid; grid-template-columns: 230px 1fr; gap: 28px; }
  .days { display: flex; flex-direction: column; max-height: 440px; overflow: auto; border-top: 1px solid var(--rule); }
  .day { text-align: left; border: 0; border-bottom: 1px solid var(--rule-2); background: none; padding: 10px 4px; cursor: pointer; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
  .day:hover { background: var(--paper-2); color: var(--ink); }
  .day.on { color: var(--ink); font-weight: 500; box-shadow: inset 2px 0 0 var(--signal); padding-left: 10px; }
  .times { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; align-content: start; }
  .time { border: 1px solid var(--ink); color: var(--ink); background: none; border-radius: 2px; padding: 10px 0; cursor: pointer; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; transition: background 140ms, color 140ms; }
  .time:hover, .time.on { background: var(--ink); color: var(--paper); }
  .done { padding: 30px 0; }
  .done .big { font-family: var(--serif); font-size: 52px; line-height: 1; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .days { flex-direction: row; overflow-x: auto; max-height: none; border-top: 0; } .day { flex: none; flex-direction: column; border: 1px solid var(--rule); margin-right: 6px; } }
</style>
</head>
<body>
<div class="page" id="page"><div class="card empty">Loading…</div></div>
<script src="/book.js"></script>
</body>
</html>
