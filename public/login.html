<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Donna</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f3f0e8">
<link rel="stylesheet" href="/app.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .login { width: min(400px, 100%); border-top: 2px solid var(--ink); padding-top: 18px; }
  .login .logo { width: 40px; height: 40px; display: block; margin-bottom: 26px; }
  .login h1 { font-family: var(--serif); font-weight: 400; font-size: 56px; line-height: .95; letter-spacing: -.02em; margin: 0 0 10px; }
  .login .btn { width: 100%; margin-top: 18px; min-height: 42px; }
  .err { color: var(--signal); font-size: 13px; min-height: 18px; margin-top: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <form class="login" id="f">
    <img class="logo" src="/icon.svg" alt="">
    <h1>Donna</h1>
    <p class="hint" style="margin:0 0 4px">Sign in to your calendar agent.</p>
    <button class="btn primary passkey-btn hidden" type="button" id="pk">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 11c0 3-1 6-3 8M15 12c0 3-.6 5.4-1.7 7.3M8.6 8.1A4 4 0 0 1 16 10M5 13a7 7 0 0 1 12.6-6.2M19 11.5c0 2.5-.3 4.8-1 6.8"/></svg>
      <span id="pkLabel">Sign in with fingerprint / face</span></button>
    <div class="or hidden" id="or">or use your password</div>
    <label class="f" style="margin-top:14px">Password<input type="password" id="pw" autocomplete="current-password webauthn" required></label>
    <button class="btn" type="submit" id="pwBtn">Sign in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
<script src="/login.js"></script>
</body>
</html>
