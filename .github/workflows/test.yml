# Runs the offline tests and the scheduling benchmark on every push (free for private repositories within GitHub's monthly minutes).
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
